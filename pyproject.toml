[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "toolcall-replay"
version = "0.1.0"
description = "Local deterministic replay evaluator for synthetic tool-call traces"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
dependencies = []

[project.scripts]
toolcall-replay = "toolcall_replay.cli:main"
toolcall-replay-lab = "toolcall_replay_lab.server:main"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE.md", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolcall_replay", "src/toolcall_replay_lab"]

[dependency-groups]
build = [
  "hatchling==1.29.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.6.1.19",
]
dev = [
  { include-group = "build" },
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pip-audit==2.10.0",
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "ruff==0.15.11",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts/validate_ci.py"]
